
name: Daily Qilego Market Collection

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run market collector
        run: |
          python qilego_cloud/qilego_cloud/scripts/collect.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qilego_cloud/qilego_cloud/docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update market intelligence"
            git push
          fi
